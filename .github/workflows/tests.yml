name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app uses the macOS 26 SDK (Liquid Glass), so it needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swift format lint --strict --recursive Sources Tests Package.swift
          swiftlint lint --strict --quiet
      - name: Test
        run: swift test
